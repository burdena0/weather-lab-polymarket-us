<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="675" viewBox="0 0 1140 675" role="img" aria-labelledby="title"><title id="title">Weather crowd calibration research</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#444"/></marker></defs><rect width="1140" height="675" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="42" font-size="27" font-weight="bold" fill="#202020">5. Weather crowd calibration research</text><text x="30" y="77" font-size="14" font-weight="normal" fill="#202020">Isolated descriptive study: no orders, model calls, RAG writes or dashboard changes.</text><g><rect x="30" y="110" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="46" y="134" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="46" y="161" font-size="17" font-weight="bold" fill="#202020">Public venue data</text><path d="M333 123h14v20h-14z M328 127h10v5h-10z M328 135h10v5h-10z" fill="white" stroke="#333"/><path d="M30 174h330" stroke="#aaa"/><text x="46" y="196" font-size="13" font-weight="normal" fill="#202020">Gamma weather + CLOB YES histories</text><text x="46" y="214" font-size="13" font-weight="normal" fill="#202020">US climate + minute display prices</text><text x="46" y="232" font-size="13" font-weight="normal" fill="#202020">Resolved outcomes / terminal books</text></g><g><rect x="405" y="110" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="421" y="134" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="421" y="161" font-size="17" font-weight="bold" fill="#202020">Resumable collection</text><path d="M708 123h14v20h-14z M703 127h10v5h-10z M703 135h10v5h-10z" fill="white" stroke="#333"/><path d="M405 174h330" stroke="#aaa"/><text x="421" y="196" font-size="13" font-weight="normal" fill="#202020">weather_crowd_study.py</text><text x="421" y="214" font-size="13" font-weight="normal" fill="#202020">Bounded public reads; no credentials</text><text x="421" y="232" font-size="13" font-weight="normal" fill="#202020">Explicit historical windows</text><text x="421" y="250" font-size="13" font-weight="normal" fill="#202020">Separate US / international identity</text></g><g><rect x="780" y="110" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="796" y="134" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="796" y="161" font-size="17" font-weight="bold" fill="#202020">Local evidence archive</text><path d="M1083 123h14v20h-14z M1078 127h10v5h-10z M1078 135h10v5h-10z" fill="white" stroke="#333"/><path d="M780 174h330" stroke="#aaa"/><text x="796" y="196" font-size="13" font-weight="normal" fill="#202020">Compressed receipts + request hashes</text><text x="796" y="214" font-size="13" font-weight="normal" fill="#202020">One history per contract</text><text x="796" y="232" font-size="13" font-weight="normal" fill="#202020">Missing/error coverage preserved</text><text x="796" y="250" font-size="13" font-weight="normal" fill="#202020">Daily-high contracts only</text></g><g><rect x="30" y="360" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="46" y="384" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="46" y="411" font-size="17" font-weight="bold" fill="#202020">Exported research figures</text><path d="M333 373h14v20h-14z M328 377h10v5h-10z M328 385h10v5h-10z" fill="white" stroke="#333"/><path d="M30 424h330" stroke="#aaa"/><text x="46" y="446" font-size="13" font-weight="normal" fill="#202020">Platform and city PNG / PDF</text><text x="46" y="464" font-size="13" font-weight="normal" fill="#202020">Per-event CSV and exclusion report</text><text x="46" y="482" font-size="13" font-weight="normal" fill="#202020">Static gallery outside dashboard</text><text x="46" y="500" font-size="13" font-weight="normal" fill="#202020">No P&amp;L or trading-agent changes</text></g><g><rect x="405" y="360" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="421" y="384" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="421" y="411" font-size="17" font-weight="bold" fill="#202020">Outcome scoring</text><path d="M708 373h14v20h-14z M703 377h10v5h-10z M703 385h10v5h-10z" fill="white" stroke="#333"/><path d="M405 424h330" stroke="#aaa"/><text x="421" y="446" font-size="13" font-weight="normal" fill="#202020">Require one verified winning bucket</text><text x="421" y="464" font-size="13" font-weight="normal" fill="#202020">Tie-aware favorite win frequency</text><text x="421" y="482" font-size="13" font-weight="normal" fill="#202020">Calibration + uniform Brier baseline</text><text x="421" y="500" font-size="13" font-weight="normal" fill="#202020">Weather-date bootstrap intervals</text></g><g><rect x="780" y="360" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="796" y="384" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="796" y="411" font-size="17" font-weight="bold" fill="#202020">As-of price transformation</text><path d="M1083 373h14v20h-14z M1078 377h10v5h-10z M1078 385h10v5h-10z" fill="white" stroke="#333"/><path d="M780 424h330" stroke="#aaa"/><text x="796" y="446" font-size="13" font-weight="normal" fill="#202020">Latest earlier price on 30-min grid</text><text x="796" y="464" font-size="13" font-weight="normal" fill="#202020">Six sums within 0.90-1.10</text><text x="796" y="482" font-size="13" font-weight="normal" fill="#202020">Stop before any bucket reaches 0.95</text><text x="796" y="500" font-size="13" font-weight="normal" fill="#202020">Start vs sixth-check confirmation</text></g><path d="M360 195H405" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="363" y="187" font-size="11" font-weight="normal" fill="#444">read</text><path d="M735 195H780" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="740" y="187" font-size="11" font-weight="normal" fill="#444">save</text><path d="M945 285V360" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="955" y="326" font-size="11" font-weight="normal" fill="#444">prices</text><path d="M780 445H735" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="735" y="434" font-size="11" font-weight="normal" fill="#444">signal</text><path d="M405 445H360" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="360" y="434" font-size="11" font-weight="normal" fill="#444">score</text><path d="M805 285L680 360" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="679" y="319" font-size="11" font-weight="normal" fill="#444">labels to scoring only</text><text x="30" y="585" font-size="14" font-weight="normal" fill="#202020">Retrospective start uses later confirmation; main accuracy uses the sixth check.</text><text x="30" y="613" font-size="14" font-weight="normal" fill="#202020">Freshness sensitivity limits carried quotes to one hour. Quotes do not prove executable fills.</text><text x="30" y="641" font-size="14" font-weight="normal" fill="#202020">U.S. inventory starts April 22, 2026; international inventory covers the requested trailing year.</text></g></svg>