<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="995" viewBox="0 0 1140 995" role="img" aria-labelledby="title desc"><title id="title">3. Adaptive LLM routing with RAG</title><desc id="desc">UML logical component view. Dashed directional connectors carry information between components. No live execution adapter.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#444"/></marker></defs><rect width="1140" height="995" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" font-weight="bold" fill="#202020">3. Adaptive LLM routing with RAG</text><text x="30" y="72" font-size="15" font-weight="normal" fill="#202020">UML component view / new real-data protocol: weather-methods-20260916-v2</text><text x="30" y="97" font-size="12" font-weight="normal" fill="#555">Dashed arrows: «flow» information connectors. Boxes are logical responsibilities, not deployment nodes.</text><g><rect x="30" y="125" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="46" y="149" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="46" y="176" font-size="17" font-weight="bold" fill="#202020">Observed inputs</text><path d="M333 138h14v20h-14z M328 142h10v5h-10z M328 150h10v5h-10z" fill="white" stroke="#333"/><path d="M30 189h330" stroke="#aaa"/><text x="46" y="211" font-size="13" font-weight="normal" fill="#202020">US contracts, books and timestamps</text><text x="46" y="229" font-size="13" font-weight="normal" fill="#202020">Recorded frames or public capture</text><text x="46" y="247" font-size="13" font-weight="normal" fill="#202020">LLM arms: NWS + named GFS / IFS</text></g><g><rect x="405" y="125" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="421" y="149" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="421" y="176" font-size="17" font-weight="bold" fill="#202020">Chronological replay</text><path d="M708 138h14v20h-14z M703 142h10v5h-10z M703 150h10v5h-10z" fill="white" stroke="#333"/><path d="M405 189h330" stroke="#aaa"/><text x="421" y="211" font-size="13" font-weight="normal" fill="#202020">engine.replay / Session worker</text><text x="421" y="229" font-size="13" font-weight="normal" fill="#202020">Decision time and evidence cutoffs</text><text x="421" y="247" font-size="13" font-weight="normal" fill="#202020">One isolated run per strategy</text></g><g><rect x="780" y="125" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="796" y="149" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="796" y="176" font-size="17" font-weight="bold" fill="#202020">Strategy dispatcher</text><path d="M1083 138h14v20h-14z M1078 142h10v5h-10z M1078 150h10v5h-10z" fill="white" stroke="#333"/><path d="M780 189h330" stroke="#aaa"/><text x="796" y="211" font-size="13" font-weight="normal" fill="#202020">Strategy.decide(...)</text><text x="796" y="229" font-size="13" font-weight="normal" fill="#202020">Frozen per-run configuration</text><text x="796" y="247" font-size="13" font-weight="normal" fill="#202020">New protocol: availability gate</text><text x="796" y="265" font-size="13" font-weight="normal" fill="#202020">Then market and book checks</text></g><g><rect x="30" y="385" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="46" y="409" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="46" y="436" font-size="17" font-weight="bold" fill="#202020">EvidenceStore</text><path d="M333 398h14v20h-14z M328 402h10v5h-10z M328 410h10v5h-10z" fill="white" stroke="#333"/><path d="M30 449h330" stroke="#aaa"/><text x="46" y="471" font-size="13" font-weight="normal" fill="#202020">Same retrieval as fixed LLM</text><text x="46" y="489" font-size="13" font-weight="normal" fill="#202020">V2: recent 7 days + weather analogues</text><text x="46" y="507" font-size="13" font-weight="normal" fill="#202020">Immutable evidence revisions</text></g><g><rect x="405" y="385" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="421" y="409" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="421" y="436" font-size="17" font-weight="bold" fill="#202020">Context and protocol diagnostics</text><path d="M708 398h14v20h-14z M703 402h10v5h-10z M703 410h10v5h-10z" fill="white" stroke="#333"/><path d="M405 449h330" stroke="#aaa"/><text x="421" y="471" font-size="13" font-weight="normal" fill="#202020">Same validated evidence as arm 2</text><text x="421" y="489" font-size="13" font-weight="normal" fill="#202020">History count and residual spread</text><text x="421" y="507" font-size="13" font-weight="normal" fill="#202020">Bucket distance and forecast revision</text><text x="421" y="525" font-size="13" font-weight="normal" fill="#202020">Model spread, peak and regime tests</text><text x="421" y="543" font-size="13" font-weight="normal" fill="#202020">Market prices excluded</text></g><g><rect x="780" y="385" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="796" y="409" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="796" y="436" font-size="17" font-weight="bold" fill="#202020">Router and inference policy</text><path d="M1083 398h14v20h-14z M1078 402h10v5h-10z M1078 410h10v5h-10z" fill="white" stroke="#333"/><path d="M780 449h330" stroke="#aaa"/><text x="796" y="471" font-size="13" font-weight="normal" fill="#202020">Four base + two v1 + two v2 features</text><text x="796" y="489" font-size="13" font-weight="normal" fill="#202020">Small/low, medium/medium, large/high</text><text x="796" y="507" font-size="13" font-weight="normal" fill="#202020">At most one escalation to large/high</text><text x="796" y="525" font-size="13" font-weight="normal" fill="#202020">Versioned forecasting guidance</text><text x="796" y="543" font-size="13" font-weight="normal" fill="#202020">Budget + schema + citation gates</text></g><g><rect x="30" y="645" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="46" y="669" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="46" y="696" font-size="17" font-weight="bold" fill="#202020">Decision and risk policy</text><path d="M333 658h14v20h-14z M328 662h10v5h-10z M328 670h10v5h-10z" fill="white" stroke="#333"/><path d="M30 709h330" stroke="#aaa"/><text x="46" y="731" font-size="13" font-weight="normal" fill="#202020">Entry / owned-inventory exit / skip</text><text x="46" y="749" font-size="13" font-weight="normal" fill="#202020">Cost-aware sizing and price limits</text><text x="46" y="767" font-size="13" font-weight="normal" fill="#202020">LLM entry: hypothesis gates + profile</text></g><g><rect x="405" y="645" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="421" y="669" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="421" y="696" font-size="17" font-weight="bold" fill="#202020">Paper fill and account</text><path d="M708 658h14v20h-14z M703 662h10v5h-10z M703 670h10v5h-10z" fill="white" stroke="#333"/><path d="M405 709h330" stroke="#aaa"/><text x="421" y="731" font-size="13" font-weight="normal" fill="#202020">Account.fill on a later book</text><text x="421" y="749" font-size="13" font-weight="normal" fill="#202020">$50 initial cash / $40 reserve</text><text x="421" y="767" font-size="13" font-weight="normal" fill="#202020">Recheck depth, costs and exposure</text><text x="421" y="785" font-size="13" font-weight="normal" fill="#202020">Final venue settlement only</text></g><g><rect x="780" y="645" width="330" height="175" fill="white" stroke="#333" stroke-width="1.4"/><text x="796" y="669" font-size="12" font-weight="normal" fill="#555">«component»</text><text x="796" y="696" font-size="17" font-weight="bold" fill="#202020">Audit and presentation</text><path d="M1083 658h14v20h-14z M1078 662h10v5h-10z M1078 670h10v5h-10z" fill="white" stroke="#333"/><path d="M780 709h330" stroke="#aaa"/><text x="796" y="731" font-size="13" font-weight="normal" fill="#202020">Run journal and call/retrieval audits</text><text x="796" y="749" font-size="13" font-weight="normal" fill="#202020">Checkpoints and acceptance receipts</text><text x="796" y="767" font-size="13" font-weight="normal" fill="#202020">Dashboard results and export</text><text x="796" y="785" font-size="13" font-weight="normal" fill="#202020">Paper outcomes; no live orders</text></g><path d="M360 210H405" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="363" y="201" font-size="11" font-weight="normal" fill="#444">frame</text><path d="M735 210H780" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="740" y="201" font-size="11" font-weight="normal" fill="#444">call</text><path d="M945 300V385" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="956" y="345" font-size="11" font-weight="normal" fill="#444">dispatch</text><path d="M570 300V385" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="581" y="345" font-size="11" font-weight="normal" fill="#444">as of t</text><path d="M360 470H405" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="363" y="460" font-size="11" font-weight="normal" fill="#444">data</text><path d="M735 470H780" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="738" y="460" font-size="11" font-weight="normal" fill="#444">context</text><path d="M945 560V609H195V645" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="473" y="599" font-size="11" font-weight="normal" fill="#444">validated forecast / deterministic candidate</text><path d="M360 730H405" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="360" y="720" font-size="11" font-weight="normal" fill="#444">intent</text><path d="M735 730H780" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="740" y="720" font-size="11" font-weight="normal" fill="#444">audit</text><text x="30" y="873" font-size="13" font-weight="bold" fill="#202020">COMMON EXECUTION BOUNDARY</text><text x="30" y="899" font-size="14" font-weight="normal" fill="#202020">Protocol requires t &gt;= 2026-09-16 17:30:00 UTC. Sample demos retain the original protocol. No live orders.</text><text x="30" y="927" font-size="13" font-weight="normal" fill="#202020">Routing is deterministic; the LLM cannot change risk limits or the shared budget.</text><text x="30" y="951" font-size="13" font-weight="normal" fill="#202020">Score 0 -&gt; small; 1-2 -&gt; medium; 3-8 -&gt; large. Final interval width &gt; 0.40 forces abstention.</text></g></svg>