  <g id="text_25">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="30.24" transform="rotate(-0 34.56 30.24)">Historical weather forecast comparison</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="56.952" transform="rotate(-0 34.56 56.952)">6–15 September 2026  |  Five US stations  |  25 shared station-days / 10 calendar dates</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="34.56" y="80.64" transform="rotate(-0 34.56 80.64)">Fixed threshold: daily high at least 80°F. Forecast accuracy only; no trading-profit estimate.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="413.28" transform="rotate(-0 34.56 413.28)">Whiskers: descriptive 95% calendar-day block bootstrap (2,000 draws). Only ten dates; exploratory evidence.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="430.92" transform="rotate(-0 34.56 430.92)">Shared cases exclude abstentions and failed requests. This can bias the comparison; coverage is shown separately.</text>
  </g>
  <g id="text_30">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="448.56" transform="rotate(-0 34.56 448.56)">Wallet / arbitrage control: NOT EVALUATED. Historical depth and verified reference-wallet signals are unavailable.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="34.56" y="471.24" transform="rotate(-0 34.56 471.24)">Sources: IEM archived GFS MOS + raw NWS CLI; immutable Weather Lab prediction audits. Archive availability is assumed.</text>
  </g>
